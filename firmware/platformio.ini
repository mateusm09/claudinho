[env:esp32s3box]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1401
monitor_port = /dev/cu.usbmodem1401
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.2.1
